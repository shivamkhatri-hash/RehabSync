<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoseCare</title>
    <style>
      /* Paint the canvas in the correct colour before the bundle loads (avoids a light flash) */
      html.dark {
        background-color: #0a1120;
      }
    </style>
    <script>
      // Applied before first paint so the saved theme never flashes the wrong colours.
      (function () {
        try {
          var saved = window.localStorage.getItem('posecare-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* localStorage unavailable — stay on the light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
