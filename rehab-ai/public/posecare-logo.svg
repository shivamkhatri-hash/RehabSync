<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- Teal-to-Green Gradient for CARE letters -->
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="35%" stop-color="#0EA5E9" />
      <stop offset="65%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Inner Emblem Glow Gradient -->
    <linearGradient id="emblemCenterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- Navy Gradient -->
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2B47" />
      <stop offset="100%" stop-color="#082035" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 8)">
    <!-- ==================== 'P' ==================== -->
    <path d="M 12 18 L 48 18 C 62 18 72 26 72 38 C 72 50 62 58 48 58 L 30 58 L 30 88 L 12 88 Z M 30 34 L 30 42 L 46 42 C 51 42 54 39.5 54 36 C 54 32.5 51 30 46 30 L 30 30 Z" fill="#0B2B47" />

