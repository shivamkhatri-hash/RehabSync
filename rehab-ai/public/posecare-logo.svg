      <circle cx="0" cy="0" r="35" fill="url(#emblemCenterGrad)" />

      <!-- Navy Outer Ring Arcs -->
      <path d="M -35 0 A 35 35 0 0 1 35 0 A 35 35 0 0 1 20 28.5 L 10 17 A 20 20 0 0 0 20 0 A 20 20 0 0 0 -20 0 A 20 20 0 0 0 -10 17 L -20 28.5 A 35 35 0 0 1 -35 0 Z" fill="#0B2B47" />

      <!-- Human Silhouette (Rehabilitation / Mobility / Support) -->
      <!-- Head -->
      <circle cx="0" cy="-11" r="7" fill="#FFFFFF" />
      <!-- Torso and Raised Victory Arms -->
      <path d="M -16 -4 C -12 6, -6 12, -4 35 L 4 35 C 6 12, 12 6, 16 -4 C 18 -9, 13 -13, 9 -9 C 6 -6, 4 3, 0 3 C -4 3, -6 -6, -9 -9 C -13 -13, -18 -9, -16 -4 Z" fill="#FFFFFF" />
    </g>

    <!-- ==================== 'S' ==================== -->
    <path d="M 198 28 C 190 20 178 18 168 18 C 152 18 142 27 142 39 C 142 59 184 55 184 70 C 184 76 177 80 167 80 C 154 80 144 73 138 65 L 125 76 C 134 89 149 96 167 96 C 187 96 201 84 201 69 C 201 48 159 52 159 38 C 159 33 164 29 170 29 C 179 29 187 34 191 40 Z" fill="#0B2B47" />

    <!-- ==================== 'E' ==================== -->
    <path d="M 216 18 L 260 18 L 260 33 L 233 33 L 233 46 L 257 46 L 257 60 L 233 60 L 233 73 L 261 73 L 261 88 L 216 88 Z" fill="url(#tealGradient)" />

    <!-- ==================== 'C' ==================== -->
    <path d="M 326 32 C 318 22 305 18 291 18 C 269 18 253 34 253 53 C 253 72 269 88 291 88 C 305 88 318 84 326 74 L 314 62 C 308 68 299 72 291 72 C 279 72 270 63 270 53 C 270 43 279 34 291 34 C 299 34 308 38 314 44 Z" fill="url(#tealGradient)" />

    <!-- ==================== 'A' ==================== -->
    <path d="M 348 18 L 330 88 L 348 88 L 354 69 L 378 69 L 384 88 L 402 88 L 384 18 Z M 366 32 L 374 55 L 358 55 Z" fill="url(#tealGradient)" />

    <!-- ==================== 'R' ==================== -->
    <path d="M 408 18 L 439 18 C 452 18 460 25 460 36 C 460 45 454 51 445 54 L 464 88 L 444 88 L 428 58 L 425 58 L 425 88 L 408 88 Z M 425 32 L 425 45 L 438 45 C 443 45 446 42 446 38.5 C 446 35 443 32 438 32 Z" fill="url(#tealGradient)" />

    <!-- ==================== 'E' ==================== -->
    <path d="M 470 18 L 512 18 L 512 33 L 487 33 L 487 46 L 509 46 L 509 60 L 487 60 L 487 73 L 513 73 L 513 88 L 470 88 Z" fill="url(#tealGradient)" />

    <!-- ==================== TAGLINE ==================== -->
    <text x="260" y="118" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="14" 
          font-weight="800" 
          letter-spacing="5.5" 
          fill="#0B2B47">
      YOUR MOVEMENT. OUR SUPPORT.
